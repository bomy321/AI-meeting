<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>貪吃蛇</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            color: #e2e8f0;
            padding: 1rem;
        }

        .game-container {
            text-align: center;
            max-width: 720px;
            width: 100%;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, #4ade80, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 1.25rem;
        }

        .score-board {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 1rem;
        }

        .score-item {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 0.6rem 1.4rem;
        }

        .score-label {
            font-size: 0.75rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .score-value {
            font-size: 1.75rem;
            font-weight: 700;
            color: #4ade80;
        }

        .canvas-wrap {
            position: relative;
            display: inline-block;
            border-radius: 16px;
            overflow: hidden;
            box-shadow:
                0 0 0 2px rgba(74, 222, 128, 0.3),
                0 20px 60px rgba(0, 0, 0, 0.5);
        }

        canvas {
            display: block;
            width: 100%;
            max-width: 640px;
            height: auto;
            background: #0a0f1a;
        }

        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(10, 15, 26, 0.85);
            backdrop-filter: blur(4px);
            transition: opacity 0.3s;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .overlay h2 {
            font-size: 1.6rem;
            margin-bottom: 0.5rem;
        }

        .overlay p {
            color: #94a3b8;
            margin-bottom: 1.25rem;
            font-size: 0.95rem;
        }

        .btn {
            background: linear-gradient(135deg, #4ade80, #22d3ee);
            color: #0f172a;
            border: none;
            border-radius: 10px;
            padding: 0.75rem 2rem;
            font-size: 1rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(74, 222, 128, 0.35);
        }

        .btn:active { transform: translateY(0); }

        .controls {
            margin-top: 1.25rem;
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 0.55rem 1.2rem;
            font-size: 0.9rem;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn-secondary:hover { background: rgba(255, 255, 255, 0.14); }

        .hint {
            margin-top: 1rem;
            font-size: 0.8rem;
            color: #64748b;
            line-height: 1.6;
        }

        .dpad {
            display: none;
            margin-top: 1.25rem;
            grid-template-columns: repeat(3, 72px);
            grid-template-rows: repeat(3, 72px);
            gap: 6px;
            justify-content: center;
        }

        .dpad button {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #e2e8f0;
            font-size: 1.2rem;
            cursor: pointer;
            transition: background 0.15s;
        }

        .dpad button:active { background: rgba(74, 222, 128, 0.25); }

        .dpad .empty { visibility: hidden; pointer-events: none; }

        @media (max-width: 700px) {
            .dpad { display: grid; }
            .hint .desktop-only { display: none; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐍 貪吃蛇</h1>
        <p class="subtitle">吃掉食物，讓蛇越長越好！</p>

        <div class="score-board">
            <div class="score-item">
                <div class="score-label">分數</div>
                <div class="score-value" id="score">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">最高分</div>
                <div class="score-value" id="highScore">0</div>
            </div>
        </div>

        <div class="canvas-wrap">
            <canvas id="game" width="640" height="640"></canvas>
            <div class="overlay" id="overlay">
                <h2 id="overlayTitle">貪吃蛇</h2>
                <p id="overlayMsg">按「開始遊戲」或空白鍵開始</p>
                <button class="btn" id="startBtn">開始遊戲</button>
            </div>
        </div>

        <div class="controls">
            <button class="btn-secondary" id="pauseBtn">暫停</button>
            <button class="btn-secondary" id="restartBtn">重新開始</button>
        </div>

        <div class="dpad" id="dpad">
            <div class="empty"></div>
            <button data-dir="up">▲</button>
            <div class="empty"></div>
            <button data-dir="left">◀</button>
            <div class="empty"></div>
            <button data-dir="right">▶</button>
            <div class="empty"></div>
            <button data-dir="down">▼</button>
            <div class="empty"></div>
        </div>

        <p class="hint">
            <span class="desktop-only">方向鍵 或 WASD 控制方向 · 空白鍵 暫停/繼續</span>
            <span class="mobile-only" style="display:none">使用下方方向鍵控制</span>
        </p>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlayMsg = document.getElementById('overlayMsg');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const restartBtn = document.getElementById('restartBtn');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');

        const GRID = 32;
        const CELL = canvas.width / GRID;
        const SPEED = 220;

        let snake, direction, nextDirection, food, score, highScore;
        let gameLoop = null;
        let state = 'idle'; // idle | playing | paused | over

        highScore = parseInt(localStorage.getItem('snakeHighScore') || '0', 10);
        highScoreEl.textContent = highScore;

        if (window.innerWidth <= 700) {
            document.querySelector('.mobile-only').style.display = 'inline';
        }

        function initGame() {
            const mid = Math.floor(GRID / 2);
            snake = [
                { x: mid, y: mid },
                { x: mid - 1, y: mid },
                { x: mid - 2, y: mid },
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { ...direction };
            score = 0;
            scoreEl.textContent = '0';
            spawnFood();
        }

        function spawnFood() {
            let pos;
            do {
                pos = {
                    x: Math.floor(Math.random() * GRID),
                    y: Math.floor(Math.random() * GRID),
                };
            } while (snake.some(s => s.x === pos.x && s.y === pos.y));
            food = pos;
        }

        function drawGrid() {
            ctx.fillStyle = '#0a0f1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(255,255,255,0.03)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= GRID; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CELL, 0);
                ctx.lineTo(i * CELL, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * CELL);
                ctx.lineTo(canvas.width, i * CELL);
                ctx.stroke();
            }
        }

        function drawSnake() {
            snake.forEach((seg, i) => {
                const pad = i === 0 ? 1 : 2;
                const size = CELL - pad * 2;
                const x = seg.x * CELL + pad;
                const y = seg.y * CELL + pad;

                if (i === 0) {
                    const grad = ctx.createLinearGradient(x, y, x + size, y + size);
                    grad.addColorStop(0, '#4ade80');
                    grad.addColorStop(1, '#22d3ee');
                    ctx.fillStyle = grad;
                } else {
                    const alpha = 1 - (i / snake.length) * 0.5;
                    ctx.fillStyle = `rgba(74, 222, 128, ${alpha})`;
                }

                ctx.beginPath();
                ctx.roundRect(x, y, size, size, i === 0 ? 6 : 4);
                ctx.fill();

                if (i === 0) {
                    ctx.fillStyle = '#0f172a';
                    const eyeSize = 3;
                    const ex = direction.x !== 0 ? (direction.x > 0 ? x + size - 7 : x + 4) : x + 5;
                    const ey = direction.y !== 0 ? (direction.y > 0 ? y + size - 7 : y + 4) : y + 5;
                    ctx.beginPath();
                    ctx.arc(ex, ey, eyeSize, 0, Math.PI * 2);
                    ctx.arc(ex + (direction.y !== 0 ? 6 : 0), ey + (direction.x !== 0 ? 6 : 0), eyeSize, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }

        function drawFood() {
            const pad = 3;
            const x = food.x * CELL + pad;
            const y = food.y * CELL + pad;
            const size = CELL - pad * 2;

            ctx.shadowColor = '#f87171';
            ctx.shadowBlur = 12;
            ctx.fillStyle = '#f87171';
            ctx.beginPath();
            ctx.arc(x + size / 2, y + size / 2, size / 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.beginPath();
            ctx.arc(x + size / 2 - 2, y + size / 2 - 2, 2, 0, Math.PI * 2);
            ctx.fill();
        }

        function render() {
            drawGrid();
            drawFood();
            drawSnake();
        }

        function update() {
            direction = { ...nextDirection };

            const head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y,
            };

            if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
                gameOver();
                return;
            }

            if (snake.some(s => s.x === head.x && s.y === head.y)) {
                gameOver();
                return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = score;
                if (score > highScore) {
                    highScore = score;
                    highScoreEl.textContent = highScore;
                    localStorage.setItem('snakeHighScore', String(highScore));
                }
                spawnFood();
            } else {
                snake.pop();
            }

            render();
        }

        function showOverlay(title, msg, btnText) {
            overlayTitle.textContent = title;
            overlayMsg.textContent = msg;
            startBtn.textContent = btnText;
            overlay.classList.remove('hidden');
        }

        function hideOverlay() {
            overlay.classList.add('hidden');
        }

        function startGame() {
            if (state === 'playing') return;
            initGame();
            state = 'playing';
            hideOverlay();
            pauseBtn.textContent = '暫停';
            clearInterval(gameLoop);
            gameLoop = setInterval(update, SPEED);
            render();
        }

        function pauseGame() {
            if (state === 'playing') {
                state = 'paused';
                clearInterval(gameLoop);
                pauseBtn.textContent = '繼續';
                showOverlay('已暫停', '按「繼續」或空白鍵恢復遊戲', '繼續');
            } else if (state === 'paused') {
                state = 'playing';
                hideOverlay();
                pauseBtn.textContent = '暫停';
                gameLoop = setInterval(update, SPEED);
            }
        }

        function gameOver() {
            state = 'over';
            clearInterval(gameLoop);
            pauseBtn.textContent = '暫停';
            showOverlay('遊戲結束', `最終分數：${score}`, '再玩一次');
        }

        function restartGame() {
            clearInterval(gameLoop);
            state = 'idle';
            initGame();
            render();
            pauseBtn.textContent = '暫停';
            showOverlay('貪吃蛇', '按「開始遊戲」或空白鍵開始', '開始遊戲');
        }

        function setDirection(dx, dy) {
            if (state !== 'playing' && state !== 'paused') return;
            if (dx === -direction.x && dy === -direction.y) return;
            nextDirection = { x: dx, y: dy };
        }

        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(e.key.toLowerCase()) || 'wasd'.includes(key)) {
                e.preventDefault();
            }

            if (key === 'arrowup' || key === 'w') setDirection(0, -1);
            else if (key === 'arrowdown' || key === 's') setDirection(0, 1);
            else if (key === 'arrowleft' || key === 'a') setDirection(-1, 0);
            else if (key === 'arrowright' || key === 'd') setDirection(1, 0);
            else if (e.key === ' ') {
                if (state === 'idle' || state === 'over') startGame();
                else pauseGame();
            }
        });

        startBtn.addEventListener('click', () => {
            if (state === 'paused') pauseGame();
            else startGame();
        });

        pauseBtn.addEventListener('click', () => {
            if (state === 'playing' || state === 'paused') pauseGame();
        });

        restartBtn.addEventListener('click', restartGame);

        document.getElementById('dpad').addEventListener('click', (e) => {
            const dir = e.target.dataset.dir;
            if (!dir) return;
            const map = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
            const [dx, dy] = map[dir];
            setDirection(dx, dy);
        });

        initGame();
        render();
    </script>
</body>
</html>
